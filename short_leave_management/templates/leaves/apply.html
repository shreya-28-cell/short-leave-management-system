{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Apply for Short Leave</h1>
    <p>Fill in the time and reason for your request.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if form.non_field_errors %}
            <p class="error">{{ form.non_field_errors }}</p>
        {% endif %}

        <button type="submit">Submit Request</button>
    </form>
</div>
{% endblock %}
