{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h1>Login</h1>
    <p>Employee and Admin Login</p>

    {% if form.errors %}
        <p class="error">Incorrect username or password.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Username</label>
        {{ form.username }}

        <label>Password</label>
        {{ form.password }}

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
