{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Employee Registration</h1>
    <p>Create your employee account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if form.errors %}
            <p class="error">Please correct the errors shown above.</p>
        {% endif %}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
