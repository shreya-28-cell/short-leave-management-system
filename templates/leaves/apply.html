{% extends "base.html" %}
{% block title %}Apply Leave{% endblock %}
{% block page_title %}Apply for Leave{% endblock %}

{% block content %}
<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert--error">{{ form.non_field_errors|striptags }}</div>
        {% endif %}
        {% for field in form %}
            <label class="field">
                <span class="field-label">{{ field.label }}</span>
                {{ field }}
                {% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}
            </label>
        {% endfor %}
        <button type="submit" class="btn btn--primary">Submit request</button>
    </form>
</div>
{% endblock %}
